name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip launcher
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Descompactando $ZIP"
          unzip -o "$ZIP"
          # Move pra raiz se tiver dentro de pasta
          for d in */; do
            if [ -f "$d/gradlew" ]; then
              cp -r $d/* .
              break
            fi
          done
          ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          chmod +x gradlew
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheLastDayZ-APK
          path: app/build/outputs/apk/debug/app-debug.apk
